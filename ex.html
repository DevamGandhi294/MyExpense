    handImg.onload = function() {
      ctx.clearRect(0, 0, size, size);

      const handW = 32 * scale;
      const handH = 25 * scale;
      const handLeft = 2 * scale;
      const handBottom = 2 * scale;
      const handTop = size - handBottom - handH;

      ctx.drawImage(handImg, handLeft, handTop, handW, handH);

      const bagW = 20 * scale;
      const bagH = 20 * scale;
      const bagLeft = 16 * scale;
      const bagBottom = 16 * scale;
      const bagTop = size - bagBottom - bagH;

      const sx = bagW / 80;
      const sy = bagH / 80;

      function c(x, y) {
        return [bagLeft + x * sx, bagTop + y * sy];
      }

      ctx.strokeStyle = '#6B00DB';
      ctx.lineWidth = 3.5 * sx;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      let p = c(35, 26);
      ctx.moveTo(p[0], p[1]);

      let cp1 = c(18, 28), cp2 = c(12, 55), ep = c(20, 68);
      ctx.bezierCurveTo(cp1[0], cp1[1], cp2[0], cp2[1], ep[0], ep[1]);

      let cp = c(18, 72); ep = c(23, 72);
      ctx.quadraticCurveTo(cp[0], cp[1], ep[0], ep[1]);

      cp = c(40, 65); ep = c(57, 72);
      ctx.quadraticCurveTo(cp[0], cp[1], ep[0], ep[1]);

      cp = c(62, 72); ep = c(60, 68);
      ctx.quadraticCurveTo(cp[0], cp[1], ep[0], ep[1]);

      cp1 = c(68, 55); cp2 = c(62, 28); ep = c(45, 26);
      ctx.bezierCurveTo(cp1[0], cp1[1], cp2[0], cp2[1], ep[0], ep[1]);

      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      p = c(33, 26);
      ctx.moveTo(p[0], p[1]);
      cp = c(40, 30); ep = c(47, 26);
      ctx.quadraticCurveTo(cp[0], cp[1], ep[0], ep[1]);
      cp = c(40, 22); ep = c(33, 26);
      ctx.quadraticCurveTo(cp[0], cp[1], ep[0], ep[1]);
      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      p = c(33, 23);
      ctx.moveTo(p[0], p[1]);
      cp1 = c(25, 12); cp2 = c(35, 8); ep = c(40, 16);
      ctx.bezierCurveTo(cp1[0], cp1[1], cp2[0], cp2[1], ep[0], ep[1]);
      cp1 = c(45, 8); cp2 = c(55, 12); ep = c(47, 23);
      ctx.bezierCurveTo(cp1[0], cp1[1], cp2[0], cp2[1], ep[0], ep[1]);
      ctx.closePath();
      ctx.stroke();

      const center = c(40, 49);
      const radius = 12 * sx;
      ctx.beginPath();
      ctx.arc(center[0], center[1], radius, 0, 2 * Math.PI);
      ctx.stroke();

      ctx.fillStyle = '#6B00DB';
      ctx.font = 'bold ' + Math.round(16 * sx) + 'px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('₹', center[0], center[1] + (1.5 * sx));
    };

      link.href = canvas.toDataURL('image/png');
      link.click();
    });
</script>
